[package]
name = "goodfire-factory"
description = "GOODCOIN fire factory: anyone launches a locked GOODCOIN fire running byte-identical code to the flagship."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abhirupinspace/GoodCoin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
