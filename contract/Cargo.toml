[package]
name = "goodcoin"
description = "GOODCOIN: Proof of Good memecoin on NEAR (NEP-141). Immutable collective-milestone mint/burn mechanic."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abhirupinspace/GoodCoin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
